<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stopwatch using JS</title>
    <script src = "script.js"></script>
</head>
<body>
    <div class="wrapper">
        <h1>Stopwatch</h1>
        <p><span id = "seconds">00</span>:<span id = "milliseconds">00</span></p>
        <button id = "start">Start</button>
        <button id = "stop">Stop</button>
        <button id = "reset">Reset</button>
    </div>
</body>
</html>
